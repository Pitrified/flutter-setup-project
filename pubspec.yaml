name: fala
description: On-device Portuguese language tutor
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma:
  flutter_riverpod:
  flutter_secure_storage:
  freezed_annotation:
  go_router:
  hive:
  hive_flutter:
  json_annotation:
  logger:
  openai_dart:
  path_provider:
  riverpod_annotation:

dev_dependencies:
  build_runner:
  custom_lint:
  flutter_lints:
  flutter_test:
    sdk: flutter
  freezed:
  http:
  json_serializable:
  mockito:
  riverpod_generator:
  riverpod_lint:

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/prompts/tutor_response/
    - assets/fixtures/
